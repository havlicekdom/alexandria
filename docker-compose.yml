version: '3.8'

services:
  mysqldb:
    image: mysql:8.0.30
    restart: unless-stopped
    env_file: .env
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_ROOT_PASSWORD=$DB_ROOT_PASSWORD
      - MYSQL_DATABASE=$DB_NAME
    volumes:
      - db:/var/lib/mysql
    networks:
      - library
    ports:
      - "3306:3306"
  app:
    depends_on:
      - mysqldb
    build: .
    restart: unless-stopped
    env_file: ./packages/server/.env
    environment:
      - DB_HOST=mysqldb
    ports:
      - "3333:3333"
    stdin_open: true
    tty: true
    networks:
      - library
volumes:
  db:
networks:
  library: {}
